<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173d37">
  <title>Góc học tập · Atlat Việt</title>
  <meta name="description" content="Học và chơi cùng Atlat Việt.">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/atlas/mark.svg">
</head>
<body>
<header class="site-head"></header>
<main class="feature-page" data-workspace="study">
  <div class="atlas-shell feature-shell">
    <nav class="breadcrumbs" aria-label="Đường dẫn"><a href="/">Trang chủ</a><span id="workspace-parent" hidden><a href="/hoc-tap">Góc học tập</a></span></nav>
    <div class="workspace-layout">
      <section id="workspace">
        <section class="study-section" id="study" hidden>
          <div class="study-head"><div><h1>Góc học tập</h1><p id="study-role"></p></div><a class="text-button" id="study-progress" href="/so-hoc-tap" hidden>Sổ học tập</a></div>
          <div class="study-grid" id="study-grid" aria-live="polite"></div>
        </section>
        <section class="study-section" id="chapters" hidden></section>
        <dialog id="activity" aria-label="Hoạt động học tập"></dialog>
      </section>
    </div>
  </div>
</main>
<script type="module" src="/navigation.js"></script>
<script type="module" src="/feature.js"></script>

</html>
